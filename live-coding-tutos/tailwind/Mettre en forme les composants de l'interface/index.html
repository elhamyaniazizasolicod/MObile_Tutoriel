<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-gray-800 text-white p-6">

        <h2 class="text-xl font-bold mb-8">
            Administration
        </h2>

        <nav class="space-y-2">

            <!-- Lien actif -->
            <a href="#"
               class="block bg-blue-600 text-white rounded-lg px-4 py-2">
                Catégories
            </a>

            <!-- Liens inactifs -->
            <a href="#"
               class="block text-gray-300 hover:bg-gray-700 rounded-lg px-4 py-2">
                Cours
            </a>

            <a href="#"
               class="block text-gray-300 hover:bg-gray-700 rounded-lg px-4 py-2">
                Utilisateurs
            </a>

        </nav>
    </aside>


    <!-- CONTENU PRINCIPAL -->
    <div class="flex-1">

        <!-- HEADER -->
        <header class="bg-white shadow-sm border-b p-6">

            <div class="flex justify-between items-center">

                <h1 class="text-2xl font-bold text-gray-800">
                    Gestion des catégories
                </h1>
                <h2 class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700"> admin</h2>

            </div>

        </header>

        
        <!-- MAIN -->
        <main class="p-6">

            <div class="flex justify-end mb-6">
              <button
                 class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                 + Nouvelle catégorie
              </button>
          </div>
            

            <!-- FORMULAIRE -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">

                <h2 class="text-lg font-semibold mb-4">
                    Ajouter une catégorie
                </h2>

                <form class="space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Nom
                        </label>

                        <input
                            type="text"
                            placeholder="Nom de la catégorie"
                            class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Couleur
                        </label>

                        <input
                            type="text"
                            placeholder="Couleur"
                            class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                         <div class="flex justify-end gap-2">

                            <button 
                                type="submit" 
                                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                                Ajouter
                            </button>

                            <button 
                                type="button" 
                                class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">
                                Annuler
                            </button>

                        </div>

                </form>

            </div>


            <!-- TABLEAU -->
            <div class="bg-white rounded-lg shadow overflow-hidden">

                <table class="w-full">

                    <thead>
                        <tr class="bg-gray-50 text-left text-xs text-gray-500 uppercase">
                            <th class="px-8 py-4">
                                ID
                            </th>

                            <th class="px-8 py-4">
                                Nom
                            </th>

                            <th class="px-8 py-4">
                                Couleur
                            </th>

                            <th class="px-8 py-4">
                                Actions
                            </th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr class="border-b hover:bg-gray-50">
                            <td class="px-6 py-4">
                                1
                            </td>

                            <td class="px-6 py-4">
                                PHP
                            </td>

                            <td class="px-6 py-4">
                                Bleu
                            </td>

                            <td class="px-6 py-4">
                                <button class="text-blue-600 hover:text-blue-800">
                                    Modifier
                                </button>
                            </td>
                            <td class="px-6 py-4">
                                <button class="text-blue-600 hover:text-blue-800">
                                    suprimer
                                </button>
                            </td>
                        </tr>

                        <tr class="border-b hover:bg-gray-50">
                            <td class="px-6 py-4">
                                2
                            </td>

                            <td class="px-6 py-4">
                                JavaScript
                            </td>

                            <td class="px-6 py-4">
                                Jaune
                            </td>

                            <td class="px-6 py-4">
                                <button class="text-blue-600 hover:text-blue-800">
                                    Modifier
                                </button>
                            </td>
                            <td class="px-6 py-4">
                                <button class="text-blue-600 hover:text-blue-800">
                                    suprimer
                                </button>
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </main>

    </div>

</div>

</body>
</html>
